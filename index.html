<script>
(function(){
  const URL="https://xodufvmosjtpbamqnqkw.supabase.co";
  const KEY="sb_publishable_0vlOvtCgEPUInIQGxc_r1g_hzd87B4F";
  const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const mapProduct=p=>({id:p.id,sku:p.sku,nombre:p.name,descripcion:p.description||"",marca:p.brand||"THOP",categoria:p.category_id||"General",imagen:p.image_url||"",precio:Number(p.effective_price||0),precioPublico:Number(p.effective_price||0),precioMinorista:Number(p.effective_price||0),precioMayorista:Number(p.effective_price||0),costo:0,stock:999999,stockMin:0,vence:null,proveedor:"",oculto:false});
  async function profile(session){
    if(!session?.user) return null;
    const {data,error}=await sb.rpc("current_profile");
    if(error) throw error;
    if(!data) return null;
    const p=Array.isArray(data)?data[0]:data;
    if(!p) return null;
    return {id:p.id,email:p.email||session.user.email,nombre:p.full_name||session.user.email,tipo:p.tipo_cliente,role:p.role,estado:p.estado_cuenta,telefono:p.phone,direccion:p.address,customPrices:{}};
  }
  async function loadCatalog(setProducts){
    const {data,error}=await sb.from("catalog_products").select("id,sku,barcode,name,brand,description,image_url,category_id,effective_price").order("name");
    if(error) throw error;
    setProducts((data||[]).map(mapProduct)); return data||[];
  }
  async function loadOrders(setOrders,user){
    if(!user?.id){setOrders([]);return;}
    const {data:orders,error}=await sb.from("orders").select("id,customer_id,status,subtotal,total,notes,created_at,updated_at").eq("customer_id",user.id).order("created_at",{ascending:false});
    if(error) throw error;
    const ids=(orders||[]).map(x=>x.id); if(!ids.length){setOrders([]);return;}
    const [{data:details,error:de},{data:tracking,error:te}]=await Promise.all([
      sb.from("order_details").select("id,order_id,product_id,quantity,precio_unitario,line_total").in("order_id",ids),
      sb.from("order_tracking").select("id,order_id,status,note,created_at").in("order_id",ids).order("created_at")
    ]);
    if(de) throw de; if(te) throw te;
    const productIds=[...new Set((details||[]).map(x=>x.product_id))];
    let products=[];
    if(productIds.length){const {data:ps,error:pe}=await sb.from("catalog_products").select("id,name,sku").in("id",productIds);if(pe) throw pe;products=ps||[];}
    const pm=new Map(products.map(x=>[x.id,x]));
    setOrders((orders||[]).map(o=>({id:o.id,folio:"THOP-"+o.id.slice(0,8).toUpperCase(),userId:o.customer_id,userEmail:user.email,total:Number(o.total),subtotal:Number(o.subtotal),estado:o.status,fecha:o.created_at,notes:o.notes,paymentMethod:"",items:(details||[]).filter(d=>d.order_id===o.id).map(d=>({productId:d.product_id,nombre:pm.get(d.product_id)?.name||"Producto",sku:pm.get(d.product_id)?.sku||"",qty:d.quantity,precio:Number(d.precio_unitario),subtotal:Number(d.line_total)})),tracking:(tracking||[]).filter(t=>t.order_id===o.id).map(t=>({status:t.status,nota:t.note,fecha:t.created_at}))})));
  }
  async function loadAdmin(setProducts,setUsers,setOrders){
    const [{data:ps,error:pe},{data:users,error:ue},{data:orders,error:oe},{data:inventory,error:ie},{data:suppliers,error:se}]=await Promise.all([
      sb.rpc("admin_list_products"),
      sb.rpc("admin_list_profiles"),
      sb.rpc("admin_list_orders"),
      sb.rpc("admin_list_inventory_summary"),
      sb.rpc("admin_list_suppliers")
    ]);
    if(pe)throw pe;if(ue)throw ue;if(oe)throw oe;if(ie)throw ie;if(se)throw se;
    const im=new Map((inventory||[]).map(x=>[x.product_id,x]));
    const sm=new Map((suppliers||[]).map(x=>[x.id,x.name]));
    setProducts((ps||[]).map(p=>{const x=im.get(p.id)||{};return {id:p.id,sku:p.sku,nombre:p.name,descripcion:p.description||"",marca:p.brand||"THOP",categoria:p.category_id||"General",imagen:p.image_url||"",precioPublico:Number(p.precio_publico),precioGymBase:Number(p.precio_minorista),precioDistBase:Number(p.precio_mayorista),precioMinorista:Number(p.precio_minorista),precioMayorista:Number(p.precio_mayorista),costo:Number(p.cost),stock:Number(x.stock||0),stockMin:0,vence:x.earliest_expiry||null,proveedor:sm.get(x.supplier_id_text)||"",oculto:!p.active||!p.visible_catalog};}));
    setUsers((users||[]).map(u=>({id:u.id,email:u.email,nombre:u.full_name,tipo:u.tipo_cliente,role:u.role,estado:u.estado_cuenta,telefono:u.phone,customPrices:{}})));
    setOrders((orders||[]).map(o=>({id:o.id,folio:"THOP-"+o.id.slice(0,8).toUpperCase(),userId:o.customer_id,userEmail:(users||[]).find(u=>u.id===o.customer_id)?.email||"",total:Number(o.total),subtotal:Number(o.subtotal),estado:o.status,fecha:o.created_at,notes:o.notes,items:[],tracking:[]})));
    return {products:ps||[],lots:lots||[],users:users||[],orders:orders||[],suppliers:suppliers||[]};
  }
  async function bootstrap({setProducts,setOrders,setUser,setView,setUsers=()=>{}}){
    const {data:{session}}=await sb.auth.getSession();
    try{const u=await profile(session);setUser(u);if(u?.role==="ADMIN")setView("admin");}catch(e){console.error("THOP profile",e);setUser(null);}
    if(session?.user){
      try{await loadCatalog(setProducts);}catch(e){console.error("THOP catalog",e);}
      try{const u=await profile(session);await loadOrders(setOrders,u);if(u?.role==="ADMIN")await loadAdmin(setProducts,setUsers,setOrders);}catch(e){console.error("THOP data",e);}
    }
    sb.auth.onAuthStateChange(async (_event,sess)=>{try{const u=await profile(sess);setUser(u);if(u?.role==="ADMIN")setView("admin");if(sess?.user){await loadCatalog(setProducts);await loadOrders(setOrders,u);if(u?.role==="ADMIN")await loadAdmin(setProducts,setUsers,setOrders);}else{setOrders([]);}}catch(e){console.error("THOP auth",e);setUser(null);}});
  }
  window.THOPSB={sb,profile,loadCatalog,loadOrders,loadAdmin,bootstrap,
    async register(q){
      const {data,error}=await sb.auth.signUp({email:q.email.trim().toLowerCase(),password:q.password,options:{data:{full_name:q.nombre.trim()}}});
      if(error) throw error;
      if(data.session){const u=await profile(data.session);return {user:u,confirmed:true};}
      return {user:null,confirmed:false};
    },
    async login(email,password){const {data,error}=await sb.auth.signInWithPassword({email:email.trim().toLowerCase(),password});if(error)throw error;const u=await profile(data.session);return u;},
    async logout(){const {error}=await sb.auth.signOut();if(error)throw error;},
    async createOrder(items,notes){const {data,error}=await sb.rpc("create_order_atomic",{p_items:items.map(x=>({product_id:x.productId,quantity:x.qty})),p_notes:notes||null});if(error)throw error;return data;},
    async createSale(){throw new Error("La venta POS requiere una función transaccional específica; create_sale_atomic no existe en THOP-TEST y no se simulará con un pedido de cliente.");},
    async updateOrderStatus(id,status){const {data,error}=await sb.rpc("admin_update_order_status",{p_order_id:id,p_status:status,p_note:"Actualizado por administrador"});if(error)throw error;return data;},
    async setCustomerType(id,tipo){const {error}=await sb.rpc("admin_update_customer_type",{p_customer_id:id,p_tipo:tipo});if(error)throw error;},
    async setSpecialPrices(customerId,prices){const {data,error}=await sb.rpc("admin_update_special_prices",{p_customer_id:customerId,p_prices:prices});if(error)throw error;return data;},
    async loadSpecialPrices(customerId){const {data,error}=await sb.rpc("admin_list_special_prices",{p_customer_id:customerId});if(error)throw error;return data||{};},
    async updateProduct(p){const {data,error}=await sb.rpc("admin_update_product",{p_product_id:p.id,p_sku:p.sku,p_name:p.nombre,p_description:p.descripcion||"",p_image_url:p.imagen||p.image_url||"",p_public_price:Number(p.precioPublico),p_retail_price:Number(p.precioGymBase??p.precioMinorista),p_wholesale_price:Number(p.precioDistBase??p.precioMayorista),p_cost:Number(p.costo),p_active:!p.oculto,p_visible_catalog:!p.oculto});if(error)throw error;return data;},
    async createProduct(){throw new Error("La creación de productos aún no está implementada en THOP-TEST; no se guardará un producto ficticio.");},
    async deleteProduct(id){const {data,error}=await sb.rpc("admin_set_product_visibility",{p_product_id:id,p_active:false,p_visible_catalog:false});if(error)throw error;return data;},
    async receivePurchase(supplierId,item){const payload={product_id:item.productId||item.product_id||item.producto_id,quantity:Number(item.qty??item.quantity??item.cantidad),unit_cost:Number(item.unit_cost??item.costo??item.cost??item.costo_unitario),lot_code:item.lot_code||item.lotCode||item.numero_lote||("THOP-"+Date.now()),expiry_date:item.expiry_date||item.vence||item.fecha_caducidad||null};const {data,error}=await sb.rpc("receive_purchase_atomic",{p_supplier_id:supplierId,p_items:[payload]});if(error)throw error;return data;}
  };
