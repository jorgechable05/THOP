name: THOP-TEST authenticated acceptance
on:
  push:
    branches:
      - dev/supabase-schema-alignment
    paths:
      - ".github/workflows/thop-test-authenticated.yml"
  workflow_dispatch:
    inputs:
      create_client_if_missing:
        description: "Register the synthetic client with Supabase Auth if it does not exist"
        required: true
        type: boolean
        default: true
      create_admin_if_missing:
        description: "Attempt signup for a fresh QA-only admin candidate if login fails (candidate remains CLIENTE until explicitly promoted)"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  authenticated-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-thop-test-auth]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: THOP-TEST
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: dev/supabase-schema-alignment
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run authenticated smoke tests
        env:
          SUPABASE_URL: ${{ secrets.THOP_TEST_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.THOP_TEST_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.THOP_TEST_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.THOP_TEST_ADMIN_PASSWORD }}
          CLIENT_EMAIL: ${{ secrets.THOP_TEST_CLIENT_EMAIL }}
          CLIENT_PASSWORD: ${{ secrets.THOP_TEST_CLIENT_PASSWORD }}
          CREATE_CLIENT_IF_MISSING: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-thop-test-auth]') || inputs.create_client_if_missing }}
          CREATE_ADMIN_IF_MISSING: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-thop-test-auth]') || inputs.create_admin_if_missing }}
        run: node qa/thop-test-authenticated.mjs
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thop-test-acceptance-report
          path: qa-results/thop-test-report.json
          if-no-files-found: warn
          retention-days: 7
